<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCT Neuron Explorer</title>
<link rel="stylesheet" href="style.css?v=64">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23151515%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222.5%22 fill=%22%23ffd27a%22/%3E%3C/svg%3E">
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body>
<header>
  <nav id="views">
    <button data-view="map" class="on">map</button>
    <button data-view="embed">embeddings</button>
  </nav>
  <select id="layer" aria-label="layer"></select>
  <span class="seg" id="layout-mode" title="sheet layout"><button data-k="index">index</button><button data-k="writes" class="on">writes</button></span>
  <span class="seg" id="web-mode" title="connection web of the focused neuron: upstream and downstream cones; yellow links push the reader up, magenta push it down"><button data-w="off">no web</button><button data-w="on" class="on">web</button></span><input id="web-z" value="5" inputmode="numeric" aria-label="web top links" title="web: the open neuron's top links each way">
  <button id="live-mode" class="on" aria-pressed="true" aria-label="live visual"><svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M1.8 12S5.6 5.4 12 5.4 22.2 12 22.2 12 18.4 18.6 12 18.6 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.1"/></svg><svg class="eye-shut" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2.2 10.5S5.8 16 12 16s9.8-5.5 9.8-5.5"/><path d="M5.4 14.1 3.9 16.2M9.6 15.8 9 18.3M14.4 15.8l.6 2.5M18.6 14.1l1.5 2.1"/></svg></button>
  <input id="jump" placeholder="L22 N2742" aria-label="go to neuron" spellcheck="false">
  <span class="seg" id="q-mode"><button data-q="lens" class="on">lens</button><button data-q="fires">fires</button></span>
  <input id="lens-q" placeholder="search lens" aria-label="search" spellcheck="false" autocomplete="off">
  <span id="status" class="mono"></span>
</header>

<main>
  <section id="map-view" class="view on">
    <canvas id="map"></canvas>
    <div id="layer-labels"></div>
    <button id="layer-back"></button>
    <div id="live-hud" aria-live="off"></div>
  </section>
  <section id="embed-view" class="view">
    <canvas id="scatter"></canvas>
    <div id="embed-empty" class="slot"></div>
    <div id="embed-bar">
      <span class="seg" id="color-by">
        <button data-c="neuron" class="on">neuron</button><button data-c="prompt">prompt</button><button data-c="dose">dose</button><button data-c="kind">kind</button>
      </span>
    </div>
    <div id="tip" class="float"></div>
  </section>

  <aside id="list" class="float">
    <div id="focus-head">
      <div class="id-line"><span id="f-id" class="mono"></span><span id="f-rank" class="mono dim"></span><button id="f-close" aria-label="close neuron">×</button></div>
      <textarea id="f-name" rows="1" placeholder="name" spellcheck="false" aria-label="feature name"></textarea>
    </div>
    <nav id="ltabs"><button data-lt="net" class="on">net</button><button data-lt="run">run</button><button id="list-hide" class="edge" aria-label="hide list">‹</button></nav>
    <div id="lt-net" class="lpane on">
      <div id="net"></div>
      <div id="list-head">
        <input id="filter" placeholder="filter" spellcheck="false" aria-label="filter by word or name">
        <label class="dim"><input type="checkbox" id="show-random"> random</label>
      </div>
      <ol id="rows" class="rows"></ol>
    </div>
    <div id="lt-run" class="lpane">
      <textarea id="inf-text" rows="6" placeholder="paste text: see which neurons fire most on each token" spellcheck="false"></textarea>
      <div id="infer">
        <div id="inf-toks"></div>
        <div id="inf-filters">
          <span class="lab">L</span><input id="inf-lo" value="0" inputmode="numeric" aria-label="from layer"><span class="lab">–</span><input id="inf-hi" value="31" inputmode="numeric" aria-label="to layer">
          <span class="seg" id="inf-sign"><button data-s="both" class="on">±</button><button data-s="+">+</button><button data-s="-">−</button></span>
          <span class="lab">≥</span><input id="inf-min" value="1.0" inputmode="decimal" aria-label="minimum score">
          <input id="inf-q" placeholder="lens has…" aria-label="lens filter" spellcheck="false">
        </div>
      </div>
      <ol id="run-rows" class="rows"></ol>
    </div>
  </aside>

  <button id="list-tab" class="tab-edge left" aria-label="show list">›</button>
  <button id="focus-tab" class="tab-edge right mono" aria-label="show neuron"></button>
  <aside id="focus" class="float">
    <nav id="tabs"><button data-tab="chat" class="on">Chat</button><button data-tab="examples">Examples</button><button data-tab="details">Details</button><button id="f-collapse" class="edge" aria-label="collapse">›</button></nav>
    <div id="tab-chat" class="tab on"></div>
    <div id="tab-examples" class="tab"></div>
    <div id="tab-details" class="tab"></div>
  </aside>
</main>
<script type="module" src="app.js?v=104"></script>
<script type="module" src="chat.js?v=2"></script>
</body>
</html>
